<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stamperia — POC</title>
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<script>
  // Doit s'exécuter avant tout rendu (donc avant le <style> ci-dessous et surtout avant
  // les scripts de fin de <body>) pour éviter un flash du mauvais thème : préférence
  // explicite (bouton, voir app.js:toggleTheme) sinon celle du système.
  (function () {
    var stored = localStorage.getItem("cms-theme");
    var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<style>
  :root {
    --bg: #f7f6f3;
    --panel: #ffffff;
    --border: #e4e2dd;
    --text: #37352f;
    --muted: #8f8c86;
    --accent: #2f76e0;
    --accent-hover: #1f5fc4;
    --status-error-bg: #fdecea;
    --status-error-fg: #b3261e;
    --status-success-bg: #e6f4ea;
    --status-success-fg: #1e7b34;
  }
  :root[data-theme="dark"] {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e8e9ec;
    --muted: #8b8f9a;
    --accent: #4f8cff;
    --accent-hover: #6f9fff;
    --status-error-bg: #3a1a1a;
    --status-error-fg: #ff8080;
    --status-success-bg: #163a24;
    --status-success-fg: #6fdb9a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 12px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  header h1 img { width: 24px; height: 24px; }
  .admin-layout {
    display: flex;
    align-items: stretch;
    flex: 1;
  }
  .sidebar {
    flex: 0 0 220px;
    width: 220px;
    border-right: 1px solid var(--border);
    padding: 20px 12px;
  }
  .sidebar[hidden] { display: none; }
  .sidebar-header { padding: 0 8px 16px; }
  .sidebar-back {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 13px;
    text-decoration: none;
  }
  .sidebar-back:hover { color: var(--text); }
  .sidebar-site-name {
    margin-top: 10px;
    padding: 0 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    overflow-wrap: break-word;
  }
  .sidebar-nav { list-style: none; margin: 0; padding: 0; }
  .sidebar-nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
    margin-bottom: 2px;
  }
  .sidebar-nav-item:hover { background: var(--panel); }
  .sidebar-nav-item.active { background: var(--panel); color: var(--accent); font-weight: 600; }
  .sidebar-nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
  .sidebar-footer {
    margin-top: 24px;
    padding: 12px 8px 0;
    border-top: 1px solid var(--border);
    font-size: 13px;
  }
  .sidebar-footer a { display: flex; align-items: center; gap: 8px; }
  main {
    flex: 1 1 auto;
    min-width: 0;
    max-width: 760px;
    margin: 0 auto;
    padding: 48px 24px;
  }
  /* Écran d'édition : deux volets côte à côte plutôt que la colonne unique centrée
     ci-dessus (voir renderEditor() dans app.js). */
  main.editor-split {
    max-width: none;
    margin: 0;
    display: flex;
    align-items: stretch;
    gap: 20px;
    padding: 24px;
  }
  main.editor-split .editor-pane,
  main.editor-split .preview-pane {
    flex: 1 1 50%;
    min-width: 0;
    margin-bottom: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    /* BlockNote positionne ses widgets flottants (poignée de bloc, menu latéral — via
       Floating UI) en "position: fixed" inline, calculé en JS : ça échappe à tout
       overflow:hidden ancestor et se positionne par défaut relatif au viewport entier,
       pas à ce volet. "contain: layout" fait de .editor-pane le containing block de ces
       descendants fixed (CSS standard), pour qu'ils restent dans ce volet au lieu de
       flotter par-dessus le volet d'aperçu voisin et intercepter ses clics (observé en
       e2e : un clic sur un lien dans l'iframe atterrissait sur .bn-trailing-block). */
    contain: layout;
  }
  main.editor-split #previewFrame {
    flex: 1 1 auto;
    min-height: 480px;
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 500;
  }
  button:hover { background: var(--accent-hover); }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  button.secondary:hover { border-color: var(--accent); }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .repo-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .repo-item:last-child { border-bottom: none; }
  .repo-item span { color: var(--muted); font-size: 13px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input, textarea {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    margin-bottom: 16px;
  }
  textarea { min-height: 220px; resize: vertical; line-height: 1.5; }
  .status {
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 16px;
  }
  .status.error { background: var(--status-error-bg); color: var(--status-error-fg); }
  .status.success { background: var(--status-success-bg); color: var(--status-success-fg); }
  .status.info { color: var(--muted); }
  #userbar { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
  .provider-badge { display: flex; align-items: center; line-height: 0; }
  a { color: var(--accent); }
  .header-actions { display: flex; align-items: center; gap: 16px; }
  #themeToggle {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px;
    line-height: 0;
  }
  #themeToggle:hover { border-color: var(--accent); background: transparent; }
  /* Barre d'actions de l'éditeur : Retour et Publier côte à côte en haut, visibles sans
     scroller le contenu — avant, Publier était en bas de tout le contenu du bloc-note. */
  .editor-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .editor-toolbar button { margin-bottom: 0; }
</style>
</head>
<body>

<header>
  <div><h1><img src="icon.svg" alt="" />Stamperia</h1></div>
  <div class="header-actions">
    <button id="themeToggle" onclick="toggleTheme()" title="Changer de thème"></button>
    <div id="userbar"></div>
  </div>
</header>

<div class="admin-layout">
  <nav id="sidebar" class="sidebar" hidden></nav>
  <main id="app">
    <p class="status info">Chargement…</p>
  </main>
</div>

<link rel="stylesheet" href="editor.bundle.css" />
<script src="config.js"></script>
<script src="pkce.js"></script>
<script src="auth.js"></script>
<script src="api.js"></script>
<script src="github-api.js"></script>
<script src="editor.bundle.js"></script>
<script src="zola-builder.bundle.js"></script>
<script src="site-builder.js"></script>
<script src="icons.js"></script>
<script src="providers.js"></script>
<script src="app.js"></script>
</body>
</html>
