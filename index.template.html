<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CMS Statique — POC</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e8e9ec;
    --muted: #8b8f9a;
    --accent: #4f8cff;
    --accent-hover: #6f9fff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 24px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header .tag {
    font-size: 12px;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 999px;
    margin-left: 10px;
  }
  .admin-layout {
    display: flex;
    align-items: stretch;
    flex: 1;
  }
  .sidebar {
    flex: 0 0 220px;
    width: 220px;
    border-right: 1px solid var(--border);
    padding: 20px 12px;
  }
  .sidebar[hidden] { display: none; }
  .sidebar-header { padding: 0 8px 16px; }
  .sidebar-back {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 13px;
    text-decoration: none;
  }
  .sidebar-back:hover { color: var(--text); }
  .sidebar-site-name {
    margin-top: 10px;
    padding: 0 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    overflow-wrap: break-word;
  }
  .sidebar-nav { list-style: none; margin: 0; padding: 0; }
  .sidebar-nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
    margin-bottom: 2px;
  }
  .sidebar-nav-item:hover { background: var(--panel); }
  .sidebar-nav-item.active { background: var(--panel); color: var(--accent); font-weight: 600; }
  .sidebar-nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
  .sidebar-footer {
    margin-top: 24px;
    padding: 12px 8px 0;
    border-top: 1px solid var(--border);
    font-size: 13px;
  }
  .sidebar-footer a { display: flex; align-items: center; gap: 8px; }
  main {
    flex: 1 1 auto;
    min-width: 0;
    max-width: 760px;
    margin: 0 auto;
    padding: 48px 24px;
  }
  /* Écran d'édition : deux volets côte à côte plutôt que la colonne unique centrée
     ci-dessus (voir renderEditor() dans app.js). */
  main.editor-split {
    max-width: none;
    margin: 0;
    display: flex;
    align-items: stretch;
    gap: 20px;
    padding: 24px;
  }
  main.editor-split .editor-pane,
  main.editor-split .preview-pane {
    flex: 1 1 50%;
    min-width: 0;
    margin-bottom: 0;
    display: flex;
    flex-direction: column;
  }
  main.editor-split #previewFrame {
    flex: 1 1 auto;
    min-height: 480px;
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 500;
  }
  button:hover { background: var(--accent-hover); }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  button.secondary:hover { border-color: var(--accent); }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .repo-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .repo-item:last-child { border-bottom: none; }
  .repo-item span { color: var(--muted); font-size: 13px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input, textarea {
    width: 100%;
    background: #0c0e12;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    margin-bottom: 16px;
  }
  textarea { min-height: 220px; resize: vertical; line-height: 1.5; }
  .status {
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 16px;
  }
  .status.error { background: #3a1a1a; color: #ff8080; }
  .status.success { background: #163a24; color: #6fdb9a; }
  .status.info { color: var(--muted); }
  #userbar { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>

<header>
  <div><h1>CMS Statique <span class="tag">POC — 100% front, sans serveur</span></h1></div>
  <div id="userbar"></div>
</header>

<div class="admin-layout">
  <nav id="sidebar" class="sidebar" hidden></nav>
  <main id="app">
    <p class="status info">Chargement…</p>
  </main>
</div>

<link rel="stylesheet" href="editor.bundle.css" />
<script src="config.js"></script>
<script src="pkce.js"></script>
<script src="auth.js"></script>
<script src="api.js"></script>
<script src="editor.bundle.js"></script>
<script src="zola-builder.bundle.js"></script>
<script src="site-builder.js"></script>
<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
