<footer class="site-footer">
  <div class="footer-content">
    <div class="footer-info">
      <p class="copyright">
        © {{ now() | date(format="%Y") }} {{ config.extra.author_name }}. All rights reserved.
      </p>
      <p class="theme-credit">
        Powered by <a href="https://github.com/botadrien/stamp-cms" target="_blank" rel="noopener">Stamp CMS</a>
      </p>
    </div>

    <div class="social-links">
      <a href="{{ get_url(path='blog/rss.xml') }}" class="social-link" aria-label="RSS feed">
        {{ ico::mask(name="rss", class="social-icon") }}
      </a>
      {% for s in config.extra.social_links %}
      <a href="{{ s.url }}" class="social-link" aria-label="{{ s.name }}"{% if not s.url is starting_with("mailto:") %} target="_blank" rel="noopener"{% endif %}>
        {{ ico::mask(name=s.icon, class="social-icon") }}
      </a>
      {% endfor %}
    </div>
  </div>
</footer>
